name: Windows regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build and run regression suite
        run: cmake --build build --config Release --target regression --parallel

      - name: Package public binaries
        run: ./tools/package.ps1 -ReleaseDir ./build/Release -OutputDir ./build/public-package
